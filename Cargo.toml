[package]
name = "ssh-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Personal SSH MCP server (STDIO) for Windows"
publish = false

[dependencies]
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io"] }
# 加密後端使用 ring：Windows 上只需要 MSVC 編譯器，不需要 CMake / NASM（aws-lc-rs 需要）
russh = { version = "=0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.9"
anyhow = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "6"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
pageant = "0.2"
